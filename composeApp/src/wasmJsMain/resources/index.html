<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Study App - Waitaminute Digital</title>
    <style>
        html, body, #ComposeTarget {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        #ComposeTarget {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #AppLoader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.4s ease-out;
            color: #E5C158;
            user-select: none;
        }

        .loader-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #E5C158;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        .loader-subtitle {
            font-size: 0.8rem;
            color: #FFC107;
            letter-spacing: 2px;
            margin-bottom: 2rem;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 193, 7, 0.15);
            border-radius: 50%;
            border-top-color: #FFC107;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div id="ComposeTarget"></div>
    <div id="AppLoader">
        <div class="loader-title">Bible Study App</div>
        <div class="loader-subtitle">Waitaminute Digital</div>
        <div class="spinner"></div>
    </div>
    <script src="composeApp.js"></script>
</body>
</html>
